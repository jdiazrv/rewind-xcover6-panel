# Netlify build for the REWIND webapp.
#
# Why this file exists at all: the repo's committed `public/` folder is the
# build for SIGNAL K, which serves the app from the subpath
# /rewind-xcover6-panel/ and therefore has
# <base href="/rewind-xcover6-panel/"> baked into its index.html. Netlify
# serves from the site root, so pointing Netlify at `public/` makes every
# asset resolve to /rewind-xcover6-panel/main.dart.js and 404 — the app
# never loads. It isn't a matter of picking a different folder to publish;
# the two hosts genuinely need two different builds, so Netlify does its
# own here with the root base href.
#
# Flutter isn't preinstalled on Netlify images, hence the shallow clone.
# Pinned to a tag rather than tracking `stable` so a future Flutter
# release can't silently change what this site builds.
#
# --no-web-resources-cdn: by default Flutter loads CanvasKit from
# www.gstatic.com, which the Content-Security-Policy in web/_headers
# rightly refuses ("Refused to load ... canvaskit.js because it does not
# appear in the script-src directive"), leaving a blank page. Serving
# CanvasKit from our own origin fixes that without loosening the CSP —
# and matters beyond Netlify: this is a boat app that has to start with
# no internet at all, which a CDN dependency would prevent.

[build]
  command = """
    git clone https://github.com/flutter/flutter.git --depth 1 -b 3.47.1 "$HOME/flutter" &&
    export PATH="$HOME/flutter/bin:$PATH" &&
    flutter config --no-analytics &&
    flutter pub get &&
    flutter build web --release --no-web-resources-cdn
  """
  publish = "build/web"

[build.environment]
  # Flutter needs a writable pub cache inside the build sandbox.
  PUB_CACHE = "/opt/build/cache/.pub-cache"
